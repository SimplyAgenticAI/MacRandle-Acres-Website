name: Keep site warm

# Pings the site's lightweight /healthz endpoint so Render's free instance
# doesn't cold-start on a real visitor. Scoped to daytime/evening US Eastern
# (roughly 7am-10pm ET, covering UTC-4/UTC-5) to stay well under Render's free
# 750 instance-hours/month. The definitive fix for cold starts is a paid
# Render instance; this is the free mitigation.
#
# Note: GitHub disables scheduled workflows after 60 days with no repo activity
# (any commit re-arms them). You can also run this manually from the Actions tab.

on:
  schedule:
    - cron: "*/10 11-23 * * *"
    - cron: "*/10 0-3 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: |
          for i in 1 2 3; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 60 https://www.macrandleacres.com/healthz)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "healthz did not return 200 after retries"
          exit 1
